<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Words - 絶対等級</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;600;700&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kosugi&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="stylesheet.css">
  
  <style>
    /* 文字の細さ調整 */
    .words-text {
      text-align: center;
      font-size: 0.95rem;
      color: #808080;
      line-height: 2.1;
      margin-bottom: 70px;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 500;
    }
    
    /* 個別の記事タイトルも確実に左寄せにする */
    .post-title {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 8px;
      font-family: sans-serif;
      text-align: left !important;
    }
    .post-title a {
      color: #000000 !important;
      text-decoration: none;
    }

    .post-title a:visited {
      color: #000000 !important;
    }
    .post-title a:hover {
      text-decoration: underline;
    }

    /* 記事ごとの隙間を広げる */
    .post-item {
      margin-bottom: 45px;
      padding-bottom: 0;
      border-bottom: none;
    }

    .post-date {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 4px;
      text-align: left !important;
    }

    /* 全体のラッパー（タイトル上の余白を確保） */
    .blog-main-wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 50px 20px 80px 20px;
    }

    /* --- 全体の基本レイアウト --- */
    .blog-container {
      max-width: 850px;
      margin: 0 auto;
      display: grid;
      /* PC時：左にリスト、右にサイドバー */
      grid-template-columns: 1fr 160px;
      grid-template-areas: 
        "list sidebar"
        "footer footer";
      gap: 40px;
      align-items: start;
    }

    /* 各エリアの定義 */
  /* 記事リストエリア自体を左寄せの基準にする */
    .post-list-area { 
      grid-area: list; 
      width: 100%; 
      text-align: left; /* リスト内のテキストを左に寄せる */
    }
    .archive-sidebar { grid-area: sidebar; width: 160px; }
    .footer-pagination-area { grid-area: footer; width: 100%; margin-top: 20px; text-align: center; padding: 0; }

    /* ラインの設定 */
    .blog-divider {
      border: none;
      border-top: 1px solid #000000;
      margin: 60px 0 20px 0;
      width: 100%;
    }

    /* --- アーカイブ（サイドバー）の見た目 --- */
    .archive-title {
      font-size: 0.8rem;
      font-family: sans-serif;
      margin-bottom: 10px;
    }
    .archive-select {
      width: 100%;
      padding: 8px;
      font-family: sans-serif;
      font-size: 0.8rem;
      color: #000;
      background-color: #fff;
      border: 1px solid #000;
      border-radius: 0;
      cursor: pointer;
    }

    /* --- ページネーションの見た目 --- */
    .pagination {
      margin-top: 20px;
      text-align: center; 
      font-family: 'CineCaption', sans-serif;
      font-size: 1rem;
    }
    .pagination a {
      color: #333;
      text-decoration: none;
      margin: 0 10px;
    }
    .pagination a:hover {
      text-decoration: underline;
    }

    /* --- 中間幅（iPad等）およびスマホ：縦並びの設定 --- */
    @media (max-width: 950px) {
      .blog-container {
        grid-template-columns: 1fr;
        /* ここで順番を制御：リスト → フッター(ライン+ページネーション) → サイドバー */
        grid-template-areas: 
          "list"
          "footer"
          "sidebar";
        max-width: 650px;
        margin: 0 auto;
        padding: 0 20px; /* 端に寄りすぎないように調整 */
      }
      .archive-sidebar {
        width: 100%;
        margin-top: 60px; /* ページネーションの下にしっかり余白を作る */
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <a class="header-link" href="index.html">
    <img alt="絶対等級" class="header-logo-img" src="https://blogger.googleusercontent.com/img/a/AVvXsEgzYC6fx_A_iblBTBSQRe6Um6WkZXSq-fmjwuJqZoQc6GaLhAKpNo-NOPzkQRk7G19uwREuRpKjKqE_xkVBNaLK7SmuqO3tbU1f3cnxG-C8R7Bu3rve1alTbJgFfc3ZBh3jdrZwaNo7IsaJ30BtLKcD54I3OnZV97_7NGqeQJDZ7OIU0HpR8MP57cMKAHee">
  </a>

  <nav class="nav-menu">
    <a href="index.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="blog.html">Words</a>
    <a href="link.html">Link</a>
  </nav>
  <button class="menu-toggle" aria-label="メニューを開閉">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<main>
  <div class="blog-main-wrapper">
    <h1 class="page-title">Words</h1>
    <h1 class="words-text">日記は詩で詩は日記</h1>
    
    <!-- 全体を包むメインエリア -->
    <div class="blog-container">
      
      <!-- 左側：記事リスト（PC時） -->
      <div class="post-list-area">
        <div id="blogger-posts">loading...</div>
      </div>

      <!-- 右側：アーカイブ（PC時） -->
      <aside class="archive-sidebar">
        <h2 class="archive-title">過去の詩</h2>
        <div id="blogger-archive">
          <select id="archive-dropdown" class="archive-select">
            <option value="">すべての記事</option>
          </select>
        </div>
      </aside>

      <!-- 下部：ラインとページネーション -->
      <div class="footer-pagination-area">
        <hr class="blog-divider">
        <div class="pagination">
          <a href="#" id="next-link">next</a>
          <a href="#" id="top-link">top</a>
          <a href="#" id="prev-link">prev</a>
        </div>
      </div>

    </div>
  </div>
</main>

<footer class="footer-container">
  <div class="footer-credit">Absolute Magnitude</div>
  <div>&copy; 2026, Yubico Tsumugine</div>
</footer>

<script>
  const menuToggle = document.querySelector('.menu-toggle');
  const navMenu = document.querySelector('.nav-menu');
  if (menuToggle && navMenu) {
    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('is-active');
      navMenu.classList.toggle('is-open');
    });
  }

  let allPosts = [];
  let currentPosts = [];
  let currentPage = 1;
  const postsPerPage = 10;

  function handleBloggerData(data) {
    const postsContainer = document.getElementById('blogger-posts');
    
    if (!data.feed || !data.feed.entry) {
      postsContainer.innerHTML = '<p>none</p>';
      return;
    }

    allPosts = data.feed.entry;
    displayPosts(allPosts, 1);
    generateArchiveMenu(allPosts);
  }

  function displayPosts(posts, page = 1) {
    currentPosts = posts;
    const postsContainer = document.getElementById('blogger-posts');
    postsContainer.innerHTML = '';
    currentPage = page;

    const start = (page - 1) * postsPerPage;
    const end = start + postsPerPage;
    const paginatedItems = posts.slice(start, end);
    const totalPages = Math.ceil(posts.length / postsPerPage);

    paginatedItems.forEach(entry => {
      let title = entry.title.$t;
      let link = `post.html?url=${encodeURIComponent(entry.link.find(l => l.rel === 'alternate').href)}`;
      let date = new Date(entry.published.$t).toLocaleDateString();

      const postDiv = document.createElement('div');
      postDiv.className = 'post-item';
      postDiv.innerHTML = `
        <div class="post-date">${date}</div>
        <div class="post-title"><a href="${link}">${title}</a></div>
      `;
      postsContainer.appendChild(postDiv);
    });

    const nextLink = document.getElementById('next-link');
    const topLink = document.getElementById('top-link');
    const prevLink = document.getElementById('prev-link');

    if (nextLink && topLink && prevLink) {
      nextLink.style.display = page > 1 ? 'inline' : 'none';
      nextLink.onclick = (e) => { e.preventDefault(); displayPosts(currentPosts, page - 1); };

      topLink.style.display = 'inline';
      topLink.onclick = (e) => { e.preventDefault(); displayPosts(currentPosts, 1); };

      prevLink.style.display = page < totalPages ? 'inline' : 'none';
      prevLink.onclick = (e) => { e.preventDefault(); displayPosts(currentPosts, page + 1); };
    }
  }

  function generateArchiveMenu(posts) {
    const archiveSelect = document.getElementById('archive-dropdown');
    const archives = {};

    posts.forEach(entry => {
      const date = new Date(entry.published.$t);
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const key = `${year}年${month}月`;
      
      if (!archives[key]) {
        archives[key] = 0;
      }
      archives[key]++;
    });

    archiveSelect.innerHTML = `<option value="">すべての記事 (${posts.length})</option>`;

    Object.keys(archives).forEach(key => {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = `${key} (${archives[key]})`;
      archiveSelect.appendChild(option);
    });

    archiveSelect.addEventListener('change', (e) => {
      const selected = e.target.value;
      if (!selected) {
        displayPosts(allPosts, 1);
        return;
      }

      const filtered = allPosts.filter(entry => {
        const date = new Date(entry.published.$t);
        const key = `${date.getFullYear()}年${date.getMonth() + 1}月`;
        return key === selected;
      });

      displayPosts(filtered, 1);
    });
  }
</script>

<script src="https://zettaitoukyu.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=150&callback=handleBloggerData"></script>

<a href="#" class="to-top-btn" aria-label="トップへ戻る"></a>
</body>
</html>

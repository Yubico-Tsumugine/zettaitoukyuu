<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Words - 絶対等級</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="stylesheet.css">
  
  <style>
    /* ブログ専用の調整 */
    .blog-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 50px 20px;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 40px;
    }
    
    /* アーカイブエリア */
    .archive-sidebar {
      text-align: left;
    }
    .archive-title {
      font-size: 1.2rem;
      margin-bottom: 20px;
      font-family: 'CineCaption', sans-serif;
    }
    
    /* 記事リストエリア */
    .post-list-area {
      text-align: left;
    }
    .post-item {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }
    .post-title {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .post-date {
      font-size: 0.9rem;
      color: #888;
    }
    
    /* ページネーション */
    .pagination {
      margin-top: 40px;
      text-align: center;
      font-family: 'CineCaption', sans-serif;
      font-size: 1rem;
    }
    .pagination a {
      color: #333;
      text-decoration: none;
      margin: 0 10px;
    }
    
    @media (max-width: 767px) {
      .blog-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <a class="header-link" href="index.html">
    <img alt="絶対等級" class="header-logo-img" src="https://blogger.googleusercontent.com/img/a/AVvXsEgzYC6fx_A_iblBTBSQRe6Um6WkZXSq-fmjwuJqZoQc6GaLhAKpNo-NOPzkQRk7G19uwREuRpKjKqE_xkVBNaLK7SmuqO3tbU1f3cnxG-C8R7Bu3rve1alTbJgFfc3ZBh3jdrZwaNo7IsaJ30BtLKcD54I3OnZV97_7NGqeQJDZ7OIU0HpR8MP57cMKAHee">
  </a>

  <nav class="nav-menu">
    <a href="index.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="blog.html">Words</a>
    <a href="link.html">Link</a>
  </nav>
  <button class="menu-toggle" aria-label="メニューを開閉">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<main>
  <h1 class="page-title">Word</h1>
  
  <div class="blog-container">
    <aside class="archive-sidebar">
      <h2 class="archive-title">Archive</h2>
      <div id="blogger-archive"><!-- ここにJSでアーカイブが入る --></div>
    </aside>
    
    <div class="post-list-area">
      <div id="blogger-posts"><!-- ここにJSで記事リストが入る --></div>
      
      <div class="pagination">
        <a href="#" id="prev-link">prev</a> | <a href="#" id="next-link">next</a>
      </div>
    </div>
  </div>
</main>

<footer class="footer-container">
  <div class="footer-credit">Absolute Magnitude</div>
  <div>&copy; 2026, Yubico Tsumugine</div>
</footer>

<script>
  // メニュー用スクリプト
  const menuToggle = document.querySelector('.menu-toggle');
  const navMenu = document.querySelector('.nav-menu');
  if (menuToggle && navMenu) {
    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('is-active');
      navMenu.classList.toggle('is-open');
    });
  }
</script>
<a href="#" class="to-top-btn" aria-label="トップへ戻る"></a>
<script>
  const BLOG_ID = "8658788909502610758"; // あゆみのブログID
  const POSTS_CONTAINER = document.getElementById('blogger-posts');

  async function fetchBloggerPosts() {
    // BloggerのAPIで最新の投稿を10件取得
    const url = `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts?maxResults=10&key=YOUR_API_KEY`;
    
    // ※注意：本当はAPI KEYが必要だが、今回はフィードURLで代用してJSONPっぽく動かす手法が安定する
    const feedUrl = `https://zettaitoukyu.blogspot.com/feeds/posts/default?alt=json&max-results=10`;

    try {
      const response = await fetch(feedUrl);
      const data = await response.json();
      const entries = data.feed.entry;

      POSTS_CONTAINER.innerHTML = ''; // 中身をクリア

      entries.forEach(entry => {
        const title = entry.title.$t;
        const link = entry.link.find(l => l.rel === 'alternate').href;
        const date = new Date(entry.published.$t).toLocaleDateString();

        const postElement = document.createElement('div');
        postElement.className = 'post-item';
        postElement.innerHTML = `
          <div class="post-date">${date}</div>
          <div class="post-title"><a href="${link}" style="text-decoration:none; color:#333;">${title}</a></div>
        `;
        POSTS_CONTAINER.appendChild(postElement);
      });
    } catch (error) {
      POSTS_CONTAINER.innerHTML = '<p>記事の読み込みに失敗しちゃったな。</p>';
    }
  }

  // 読み込み開始
  fetchBloggerPosts();
</script>
</body>
</html>

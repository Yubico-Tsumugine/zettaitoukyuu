<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Words - 絶対等級</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="stylesheet.css">
  
  <style>
    /* 文字の細さ調整 */
    .words-text {
      text-align: center;
      font-size: 0.95rem;
      color: #808080;
      line-height: 2.1;
      margin-bottom: 70px;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 500; /* 細くする */
    }
    
    .post-title {
      font-size: 1.1rem;
      font-weight: 500; /* 細くする */
      margin-bottom: 8px;
    }

    /* レイアウト：アーカイブを右側に */
    .blog-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 50px 20px;
      display: grid;
      grid-template-columns: 1fr 200px; /* リストを左、アーカイブを右へ */
      gap: 60px; /* 空白を広げる */
      text-align: left;
    }

    /* アーカイブボックスの角張ったデザイン */
    .archive-sidebar {
      text-align: left;
    }
    .archive-title {
      font-size: 0.8rem;
      font-family: sans-serif; /* クラシックなゴシックへ */
      margin-bottom: 10px;
    }
    .archive-select {
      width: 100%;
      padding: 8px;
      font-family: sans-serif;
      font-size: 0.8rem;
      color: #000;
      background-color: #fff; /* 背景を白に */
      border: 1px solid #000;
      border-radius: 0; /* 角を丸めない */
      cursor: pointer;
    }
    
    .post-date { font-size: 0.8rem; color: #888; }
    
    @media (max-width: 767px) {
      .blog-container { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<header class="site-header">
  <a class="header-link" href="index.html">
    <img alt="絶対等級" class="header-logo-img" src="https://blogger.googleusercontent.com/img/a/AVvXsEgzYC6fx_A_iblBTBSQRe6Um6WkZXSq-fmjwuJqZoQc6GaLhAKpNo-NOPzkQRk7G19uwREuRpKjKqE_xkVBNaLK7SmuqO3tbU1f3cnxG-C8R7Bu3rve1alTbJgFfc3ZBh3jdrZwaNo7IsaJ30BtLKcD54I3OnZV97_7NGqeQJDZ7OIU0HpR8MP57cMKAHee">
  </a>

  <nav class="nav-menu">
    <a href="index.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="blog.html">Words</a>
    <a href="link.html">Link</a>
  </nav>
  <button class="menu-toggle" aria-label="メニューを開閉">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<main>
  <h1 class="page-title">Word</h1>
  <h1 class="words-text">日記は詩で詩は日記</h1>
  
  <div class="blog-container">
    <aside class="archive-sidebar">
      <h2 class="archive-title">過去の詩</h2>
      <div id="blogger-archive">
        <!-- プルダウンメニュー -->
        <select id="archive-dropdown" class="archive-select">
          <option value="">すべての記事</option>
        </select>
      </div>
    </aside>
    
    <div class="post-list-area">
      <div id="blogger-posts">読み込み中...</div>
      
      <div class="pagination">
        <a href="#" id="prev-page" style="display:none;">prev</a> 
        <span id="page-separator" style="display:none;">|</span> 
        <a href="#" id="next-page" style="display:none;">next</a>
      </div>
    </div>
  </div>
</main>

<footer class="footer-container">
  <div class="footer-credit">Absolute Magnitude</div>
  <div>&copy; 2026, Yubico Tsumugine</div>
</footer>

<script>
  // メニュー用スクリプト
  const menuToggle = document.querySelector('.menu-toggle');
  const navMenu = document.querySelector('.nav-menu');
  if (menuToggle && navMenu) {
    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('is-active');
      navMenu.classList.toggle('is-open');
    });
  }

  // Blogger連携スクリプト（JSONP方式でCORS回避）
  let allPosts = [];

  function handleBloggerData(data) {
    const postsContainer = document.getElementById('blogger-posts');
    const archiveSelect = document.getElementById('archive-dropdown');
    
    if (!data.feed || !data.feed.entry) {
      postsContainer.innerHTML = '<p>記事が見つからなかったよ。</p>';
      return;
    }

    allPosts = data.feed.entry;
    displayPosts(allPosts);
    generateArchiveMenu(allPosts);
  }

  // ページング管理用変数
  let currentPage = 1;
  const postsPerPage = 10;

  function displayPosts(posts, page = 1) {
    const postsContainer = document.getElementById('blogger-posts');
    postsContainer.innerHTML = '';
    currentPage = page;

    const start = (page - 1) * postsPerPage;
    const end = start + postsPerPage;
    const paginatedItems = posts.slice(start, end);
    const totalPages = Math.ceil(posts.length / postsPerPage);

    paginatedItems.forEach(entry => {
      let title = entry.title.$t;
      let link = `post.html?url=${encodeURIComponent(entry.link.find(l => l.rel === 'alternate').href)}`;
      let date = new Date(entry.published.$t).toLocaleDateString();

      const postDiv = document.createElement('div');
      postDiv.className = 'post-item';
      postDiv.innerHTML = `
        <div class="post-date">${date}</div>
        <div class="post-title"><a href="${link}">${title}</a></div>
      `;
      postsContainer.appendChild(postDiv);
    });

    // ページ送りボタン（next | top | prev）の表示制御と動作
    const nextLink = document.getElementById('next-link');
    const topLink = document.getElementById('top-link');
    const prevLink = document.getElementById('prev-link');

    if (nextLink && topLink && prevLink) {
      // next: より新しい記事へ (page 1 より大きいとき表示)
      nextLink.style.display = page > 1 ? 'inline' : 'none';
      nextLink.onclick = (e) => { e.preventDefault(); displayPosts(posts, page - 1); };

      // top: 一覧の最初へ
      topLink.onclick = (e) => { e.preventDefault(); displayPosts(posts, 1); };

      // prev: より古い記事へ (最後のページじゃないとき表示)
      prevLink.style.display = page < totalPages ? 'inline' : 'none';
      prevLink.onclick = (e) => { e.preventDefault(); displayPosts(posts, page + 1); };
    }
  }

  // アーカイブのプルダウンメニューを生成する関数
  function generateArchiveMenu(posts) {
    const archiveSelect = document.getElementById('archive-dropdown');
    const archives = {};

    posts.forEach(entry => {
      const date = new Date(entry.published.$t);
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const key = `${year}年${month}月`;
      
      if (!archives[key]) {
        archives[key] = { year, month };
      }
    });

    // 年月ごとにオプションを追加
    Object.keys(archives).forEach(key => {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = key;
      archiveSelect.appendChild(option);
    });

    // プルダウンを変更したときの絞り込み処理
    archiveSelect.addEventListener('change', (e) => {
      const selected = e.target.value;
      if (!selected) {
        displayPosts(allPosts);
        return;
      }

      const filtered = allPosts.filter(entry => {
        const date = new Date(entry.published.$t);
        const key = `${date.getFullYear()}年${date.getMonth() + 1}月`;
        return key === selected;
      });

      displayPosts(filtered);
    });
  }
</script>

<!-- Bloggerのデータを安全に読み込むためのJSONPタグ -->
<script src="https://zettaitoukyu.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=150&callback=handleBloggerData"></script>

<a href="#" class="to-top-btn" aria-label="トップへ戻る"></a>
</body>
</html>

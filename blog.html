<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Words - 絶対等級</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="stylesheet.css">
  
  <style>
    .blog-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 50px 20px;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 40px;
      text-align: left;
    }
    
    .archive-sidebar {
      text-align: left;
    }
    .archive-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      font-family: 'CineCaption', sans-serif;
    }
    
    /* プルダウンのスタイル（文字：黒、背景：グレー） */
    .archive-select {
      width: 100%;
      padding: 8px 10px;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.95rem;
      color: #000000;
      background-color: #e0e0e0;
      border: 1px solid #b0b0b0;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .post-list-area {
      text-align: left;
    }
    .post-item {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .post-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .post-title a {
      color: #333333;
      text-decoration: none;
    }
    .post-title a:hover {
      text-decoration: underline;
    }
    .post-date {
      font-size: 0.85rem;
      color: #888888;
    }
    
    .pagination {
      margin-top: 40px;
      text-align: center;
      font-family: 'CineCaption', sans-serif;
      font-size: 1rem;
    }
    .pagination a {
      color: #333;
      text-decoration: none;
      margin: 0 10px;
    }
    
    @media (max-width: 767px) {
      .blog-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <a class="header-link" href="index.html">
    <img alt="絶対等級" class="header-logo-img" src="https://blogger.googleusercontent.com/img/a/AVvXsEgzYC6fx_A_iblBTBSQRe6Um6WkZXSq-fmjwuJqZoQc6GaLhAKpNo-NOPzkQRk7G19uwREuRpKjKqE_xkVBNaLK7SmuqO3tbU1f3cnxG-C8R7Bu3rve1alTbJgFfc3ZBh3jdrZwaNo7IsaJ30BtLKcD54I3OnZV97_7NGqeQJDZ7OIU0HpR8MP57cMKAHee">
  </a>

  <nav class="nav-menu">
    <a href="index.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="blog.html">Words</a>
    <a href="link.html">Link</a>
  </nav>
  <button class="menu-toggle" aria-label="メニューを開閉">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<main>
  <h1 class="page-title">Word</h1>
  
  <div class="blog-container">
    <aside class="archive-sidebar">
      <h2 class="archive-title">Archive</h2>
      <div id="blogger-archive">
        <!-- プルダウンメニュー -->
        <select id="archive-dropdown" class="archive-select">
          <option value="">すべての記事</option>
        </select>
      </div>
    </aside>
    
    <div class="post-list-area">
      <div id="blogger-posts">読み込み中...</div>
      
      <div class="pagination">
        <a href="#" id="prev-page" style="display:none;">prev</a> 
        <span id="page-separator" style="display:none;">|</span> 
        <a href="#" id="next-page" style="display:none;">next</a>
      </div>
    </div>
  </div>
</main>

<footer class="footer-container">
  <div class="footer-credit">Absolute Magnitude</div>
  <div>&copy; 2026, Yubico Tsumugine</div>
</footer>

<script>
  // メニュー用スクリプト
  const menuToggle = document.querySelector('.menu-toggle');
  const navMenu = document.querySelector('.nav-menu');
  if (menuToggle && navMenu) {
    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('is-active');
      navMenu.classList.toggle('is-open');
    });
  }

  // Blogger連携スクリプト（JSONP方式でCORS回避）
  let allPosts = [];

  function handleBloggerData(data) {
    const postsContainer = document.getElementById('blogger-posts');
    const archiveSelect = document.getElementById('archive-dropdown');
    
    if (!data.feed || !data.feed.entry) {
      postsContainer.innerHTML = '<p>記事が見つからなかったよ。</p>';
      return;
    }

    allPosts = data.feed.entry;
    displayPosts(allPosts);
    generateArchiveMenu(allPosts);
  }

  // 記事一覧を表示する関数
  function displayPosts(posts) {
    const postsContainer = document.getElementById('blogger-posts');
    postsContainer.innerHTML = '';

    // 最大10件表示
    const displayItems = posts.slice(0, 10);

    displayItems.forEach(entry => {
      let title = entry.title.$t;
      let link = '#';
      for (let i = 0; i < entry.link.length; i++) {
        if (entry.link[i].rel === 'alternate') {
          link = entry.link[i].href;
          break;
        }
      }
      let date = new Date(entry.published.$t).toLocaleDateString();

      const postDiv = document.createElement('div');
      postDiv.className = 'post-item';
      postDiv.innerHTML = `
        <div class="post-date">${date}</div>
        <div class="post-title"><a href="${link}">${title}</a></div>
      `;
      postsContainer.appendChild(postDiv);
    });
  }

  // アーカイブのプルダウンメニューを生成する関数
  function generateArchiveMenu(posts) {
    const archiveSelect = document.getElementById('archive-dropdown');
    const archives = {};

    posts.forEach(entry => {
      const date = new Date(entry.published.$t);
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const key = `${year}年${month}月`;
      
      if (!archives[key]) {
        archives[key] = { year, month };
      }
    });

    // 年月ごとにオプションを追加
    Object.keys(archives).forEach(key => {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = key;
      archiveSelect.appendChild(option);
    });

    // プルダウンを変更したときの絞り込み処理
    archiveSelect.addEventListener('change', (e) => {
      const selected = e.target.value;
      if (!selected) {
        displayPosts(allPosts);
        return;
      }

      const filtered = allPosts.filter(entry => {
        const date = new Date(entry.published.$t);
        const key = `${date.getFullYear()}年${date.getMonth() + 1}月`;
        return key === selected;
      });

      displayPosts(filtered);
    });
  }
</script>

<!-- Bloggerのデータを安全に読み込むためのJSONPタグ -->
<script src="https://zettaitoukyu.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=150&callback=handleBloggerData"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>記事詳細 - 絶対等級</title>
  <link rel="stylesheet" href="stylesheet.css">
  <style>
    .post-container { max-width: 800px; margin: 50px auto; padding: 20px; text-align: left; }
    .back-link { margin-bottom: 20px; display: block; }
  </style>
</head>
<body>
  <!-- ヘッダーはblog.htmlと共通 -->
  <main class="post-container">
    <a href="blog.html" class="back-link">← ブログ一覧へ戻る</a>
    <div id="post-content">記事を読み込んでいるよ...</div>
  </main>
  <!-- フッダーはblog.htmlと共通 -->

  <script>
    // URLのパラメータから記事を取得して表示する
    const params = new URLSearchParams(window.location.search);
    const postUrl = params.get('url');

    if (postUrl) {
      // 外部ドメインのiframe埋め込み（Bloggerの仕様上これが一番確実）
      document.getElementById('post-content').innerHTML = `<iframe src="${postUrl}" width="100%" height="800px" frameborder="0"></iframe>`;
    }
  </script>
</body>
</html>

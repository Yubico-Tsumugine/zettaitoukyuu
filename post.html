<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>記事詳細 - 絶対等級</title>
  <link rel="stylesheet" href="stylesheet.css">
  <style>
    .post-container { max-width: 800px; margin: 50px auto; padding: 20px; text-align: left; }
    .back-link { margin-bottom: 20px; display: block; }
  </style>
</head>
<body>
  <!-- ヘッダーはblog.htmlと共通 -->
  <main class="post-container">
    <a href="blog.html" class="back-link">← ブログ一覧へ戻る</a>
    <div id="post-content">記事を読み込んでいるよ...</div>
  </main>
  <!-- フッダーはblog.htmlと共通 -->

  <script>
    // URLパラメータを取得する確実な方法
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const postUrl = urlParams.get('url');

    console.log("読み込もうとしているURL:", postUrl); // デバッグ用：ブラウザのコンソールで確認できる

    if (postUrl) {
      const container = document.getElementById('post-content');
      // iframeを生成して読み込む
      container.innerHTML = `<iframe src="${postUrl}" style="width:100%; height:80vh; border:none;"></iframe>`;
    } else {
      document.getElementById('post-content').innerHTML = '<p>記事のリンクが正しく取得できなかったな。</p>';
    }
  </script>
</body>
</html>

  <style>
  /* ギャラリーページ専用のスタイル */
  .gallery-main {
    width: 100%;
    padding: 60px 20px 90px 20px;
    max-width: 1300px;
    margin: 0 auto;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px 15px;
  }

  .gallery-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .gallery-thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background-color: #f0f0f0;
    overflow: hidden;
    cursor: pointer;
    border-radius: 2px;
  }

  .gallery-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  .gallery-thumb-wrap:hover img {
    transform: scale(1.03);
    opacity: 0.35;
  }

  .gallery-item-title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    font-size: 0.95rem;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    color: #222222;
    text-align: center;
    letter-spacing: 0.05em;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    box-sizing: border-box;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow: 0 0 4px rgba(255, 255, 255, 0.9), 0 0 8px rgba(255, 255, 255, 0.9);
  }

  .gallery-thumb-wrap:hover .gallery-item-title {
    opacity: 1;
  }

  /* モーダル（拡大表示）のスタイル */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.85);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
  }

  .modal.is-active {
    display: flex;
  }

  .modal-content {
    max-width: 90%;
    max-height: 75vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .modal-title {
    color: #ffffff;
    font-size: 1.2rem;
    margin-top: 20px;
    letter-spacing: 0.05em;
    text-align: center;
  }

  .modal-close {
    position: absolute;
    top: 25px;
    right: 35px;
    color: #ffffff;
    font-size: 2.5rem;
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
  }

  @media (max-width: 900px) {
    .gallery-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 600px) {
    .gallery-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  </style>

<!-- モーダル用要素 -->
<div class="modal" id="imageModal">
  <button class="modal-close" id="modalClose">&times;</button>
  <img class="modal-content" id="modalImg" src="" alt="拡大画像">
  <div class="modal-title" id="modalTitle"></div>
</div>

<footer class="footer-container">

<script>
  // クリックで画像を大きくするモーダルの仕組み
  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('modalImg');
  const modalTitle = document.getElementById('modalTitle');
  const modalClose = document.getElementById('modalClose');
  const galleryItems = document.querySelectorAll('.gallery-item');

  galleryItems.forEach(item => {
    const thumbWrap = item.querySelector('.gallery-thumb-wrap');
    const img = item.querySelector('.gallery-img');
    const title = item.querySelector('.gallery-item-title');

    thumbWrap.addEventListener('click', () => {
      modal.classList.add('is-active');
      modalImg.src = img.src;
      modalTitle.textContent = title.textContent;
    });
  });

  // 閉じるボタンか背景クリックで閉じる
  modalClose.addEventListener('click', () => {
    modal.classList.remove('is-active');
  });

  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      modal.classList.remove('is-active');
    }
  });
</script>

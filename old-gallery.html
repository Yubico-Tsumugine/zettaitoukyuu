  <!-- モーダル用要素 -->
  <div class="modal" id="imageModal">
    <button class="modal-close" id="modalClose">&times;</button>
    <img class="modal-content" id="modalImg" src="" alt="拡大画像">
    <div class="modal-title" id="modalTitle"></div>
  </div>

  <footer class="footer-container">
    <div class="footer-credit">Absolute Magnitude</div>
    <div>&copy; 2026, Yubico Tsumugine</div>
  </footer>

  <script>
    // クリックで画像を大きくするモーダルの仕組み
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const modalTitle = document.getElementById('modalTitle');
    const modalClose = document.getElementById('modalClose');
    const galleryItems = document.querySelectorAll('.gallery-item');

    galleryItems.forEach(item => {
      const thumbWrap = item.querySelector('.gallery-thumb-wrap');
      const img = item.querySelector('.gallery-img');
      const title = item.querySelector('.gallery-item-title');

      thumbWrap.addEventListener('click', () => {
        modal.classList.add('is-active');
        modalImg.src = img.src;
        modalTitle.textContent = title.textContent;
      });
    });

    // 閉じるボタンか背景クリックで閉じる
    modalClose.addEventListener('click', () => {
      modal.classList.remove('is-active');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('is-active');
      }
    });


    const menuToggle = document.querySelector('.menu-toggle');
    const navMenu = document.querySelector('.nav-menu');

    if (menuToggle && navMenu) {
      menuToggle.addEventListener('click', () => {
        menuToggle.classList.toggle('is-active');
        navMenu.classList.toggle('is-open');
      });

      navMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          menuToggle.classList.remove('is-active');
          navMenu.classList.remove('is-open');
        });
      });
    }
  </script>
  <a href="#" class="to-top-btn" aria-label="トップへ戻る"></a>
